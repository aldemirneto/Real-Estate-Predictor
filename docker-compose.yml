services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-real_estate}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - real-estate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-real_estate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME:     ${DB_NAME:-real_estate}
    networks:
      - real-estate-network
    # Run once and exit; use `docker compose run scraper` or a cron trigger.
    # Remove the profile to always start with `docker compose up`.
    profiles: ["scraper"]

networks:
  real-estate-network:
    name: real-estate-network

# pgdata volume removed — data lives in ./data/postgres (git-ignored)
